services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: taskfoo
      POSTGRES_USER: taskfoo
      POSTGRES_PASSWORD: local-taskfoo
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskfoo -d taskfoo"]
      interval: 2s
      timeout: 3s
      retries: 15
