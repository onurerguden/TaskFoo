spring.application.name=taskfoo-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/taskfoo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:taskfoo}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
server.port=8080

app.jwt.secret=${JWT_SECRET}
app.jwt.access-exp-min=15
app.jwt.refresh-exp-days=7

app.cors.allowed-origin=http://localhost:5173

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

logging.level.org.springframework.security=INFO
